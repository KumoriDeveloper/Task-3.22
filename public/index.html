<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Цифровая визитка · Backend Engineer</title>
    <meta
      name="description"
      content="Цифровая визитка backend-инженера: профиль, навыки, опыт работы и проекты."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f13'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='16' fill='%237fe3b0' text-anchor='middle'%3EAC%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card" id="card" hidden>
      <header class="hero">
        <div class="avatar" id="avatar" aria-hidden="true">—</div>
        <div class="hero-body">
          <p class="eyebrow" id="location"></p>
          <h1 id="name">—</h1>
          <p class="headline" id="headline"></p>
          <p class="description" id="description"></p>
          <div class="links" id="links"></div>
        </div>
      </header>

      <section class="section">
        <h2><span class="index">01</span>Навыки</h2>
        <div class="skills" id="skills"></div>
      </section>

      <section class="section">
        <h2><span class="index">02</span>Опыт работы</h2>
        <div class="timeline" id="experience"></div>
      </section>

      <section class="section">
        <h2><span class="index">03</span>Проекты</h2>
        <div class="projects" id="projects"></div>
      </section>

      <footer class="footer">
        <span>
          Данные отдаёт GraphQL API —
          <a href="/graphql" target="_blank" rel="noreferrer">Apollo Sandbox</a>
        </span>
        <a class="footer-admin" href="/admin/">Админ-панель →</a>
      </footer>
    </main>

    <p class="state" id="loading">Загружаем визитку…</p>
    <p class="state error" id="error" hidden></p>

    <script src="/card.js" defer></script>
  </body>
</html>
